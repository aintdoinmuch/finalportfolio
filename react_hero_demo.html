<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>React Hero Section - HI, I'M NAMAN</title>
  
  <!-- Google Fonts: Archivo Black & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#050505] text-[#d9d9d9] m-0 p-0 overflow-x-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef } = React;

    function HeroSection({
      name = "NAMAN",
      subtitle = "A B.TECH STUDENT PASSIONATE ABOUT CRAFTING BOLD AND MEMORABLE PROJECTS ✊",
      avatarUrl = "assets/images/avatar-3d.jpg"
    }) {
      const containerRef = useRef(null);
      const [tilt, setTilt] = useState({ rotateX: 0, rotateY: 0, transX: 0, transY: 0 });

      const handleMouseMove = (e) => {
        if (!containerRef.current) return;
        const rect = containerRef.current.getBoundingClientRect();
        const x = e.clientX - rect.left - rect.width / 2;
        const y = e.clientY - rect.top - rect.height / 2;

        const rotateY = (x / (rect.width / 2)) * 14;
        const rotateX = -(y / (rect.height / 2)) * 14;
        const transX = (x / (rect.width / 2)) * 15;
        const transY = (y / (rect.height / 2)) * 15;

        setTilt({ rotateX, rotateY, transX, transY });
      };

      const handleMouseLeave = () => {
        setTilt({ rotateX: 0, rotateY: 0, transX: 0, transY: 0 });
      };

      return (
        <section
          ref={containerRef}
          onMouseMove={handleMouseMove}
          onMouseLeave={handleMouseLeave}
          className="relative min-h-screen w-full bg-[#050505] text-[#d9d9d9] flex flex-col justify-between overflow-hidden select-none"
          style={{
            backgroundImage: 'radial-gradient(circle at 50% 45%, rgba(28, 28, 36, 0.45) 0%, rgba(5, 5, 5, 0.95) 75%, #050505 100%)'
          }}
        >
          {/* Subtle Vignette */}
          <div className="absolute inset-0 pointer-events-none shadow-[inset_0_0_120px_rgba(0,0,0,0.95)] z-0" />

          {/* NAVBAR */}
          <header className="relative z-30 w-full px-6 sm:px-12 md:px-16 pt-8 pb-4">
            <nav className="w-full flex items-center justify-between text-[12px] sm:text-[13px] font-medium tracking-[0.05em] text-white/90 uppercase">
              <a href="#about" className="group relative transition-colors duration-200 hover:text-white">
                <span>ABOUT</span>
                <span className="absolute -bottom-1 left-0 h-[1px] w-0 bg-white transition-all duration-300 group-hover:w-full" />
              </a>
              <a href="#customers" className="group relative transition-colors duration-200 hover:text-white">
                <span>CUSTOMERS</span>
                <span className="absolute -bottom-1 left-0 h-[1px] w-0 bg-white transition-all duration-300 group-hover:w-full" />
              </a>
              <a href="#projects" className="group relative transition-colors duration-200 hover:text-white">
                <span>PROJECTS</span>
                <span className="absolute -bottom-1 left-0 h-[1px] w-0 bg-white transition-all duration-300 group-hover:w-full" />
              </a>
              <a href="#contact" className="group relative transition-colors duration-200 hover:text-white">
                <span>CONTACT</span>
                <span className="absolute -bottom-1 left-0 h-[1px] w-0 bg-white transition-all duration-300 group-hover:w-full" />
              </a>
            </nav>
          </header>

          {/* MAIN HERO CONTENT */}
          <div className="relative z-10 flex-1 flex flex-col justify-center items-center px-4 w-full max-w-7xl mx-auto my-auto">
            
            {/* GIANT HEADLINE */}
            <div className="relative w-full flex justify-center items-center">
              <h1
                className="text-[13vw] sm:text-[13.5vw] font-black uppercase text-[#e2e2e2] text-center tracking-[-0.03em] leading-[0.88] whitespace-nowrap select-none drop-shadow-2xl"
                style={{
                  fontFamily: '"Archivo Black", sans-serif',
                  textShadow: '0 10px 40px rgba(0, 0, 0, 0.8)'
                }}
              >
                HI, I'M {name}
              </h1>

              {/* 3D CARTOON HEAD OVERLAPPING THE HEADLINE */}
              <div
                className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-[38%] z-20 pointer-events-auto transition-transform duration-150 ease-out"
                style={{
                  perspective: '1000px',
                  transform: `translate(calc(-50% + ${tilt.transX}px), calc(-38% + ${tilt.transY}px)) rotateX(${tilt.rotateX}deg) rotateY(${tilt.rotateY}deg)`
                }}
              >
                <div className="relative w-52 sm:w-72 md:w-84 lg:w-96 aspect-square rounded-full flex items-center justify-center">
                  <div className="absolute inset-0 rounded-full bg-gradient-to-t from-indigo-500/20 via-purple-500/10 to-transparent blur-2xl -z-10" />

                  <img
                    src={avatarUrl}
                    alt={`${name} 3D Avatar`}
                    className="w-full h-full object-cover object-center rounded-3xl drop-shadow-[0_25px_35px_rgba(0,0,0,0.9)] cursor-grab active:cursor-grabbing hover:scale-105 transition-transform duration-300"
                    style={{
                      maskImage: 'radial-gradient(circle at 50% 45%, black 65%, transparent 95%)',
                      WebkitMaskImage: 'radial-gradient(circle at 50% 45%, black 65%, transparent 95%)'
                    }}
                  />
                </div>
              </div>
            </div>

            {/* LOWER ROW: Left caption and Right neon pill CTA */}
            <div className="w-full grid grid-cols-1 md:grid-cols-12 gap-6 items-end mt-8 md:mt-14 px-4 sm:px-8">
              
              {/* Left Text */}
              <div className="md:col-span-5 text-left">
                <p className="text-[12px] sm:text-[13px] md:text-[14px] font-semibold tracking-[0.04em] text-white/85 leading-snug uppercase max-w-xs">
                  {subtitle}
                </p>
              </div>

              {/* Spacer */}
              <div className="hidden md:block md:col-span-2" />

              {/* Right Button */}
              <div className="md:col-span-5 flex justify-start md:justify-end">
                <a
                  href="#contact"
                  className="group relative inline-flex items-center justify-center p-[2px] rounded-full transition-all duration-300 hover:scale-105 hover:shadow-[0_0_35px_rgba(217,70,239,0.5)]"
                  style={{
                    background: 'linear-gradient(90deg, #6366f1 0%, #d946ef 50%, #f97316 100%)'
                  }}
                >
                  <div className="px-7 py-3 rounded-full bg-[#0a0a0f] transition-colors duration-300 group-hover:bg-opacity-80">
                    <span className="text-[12px] sm:text-[13px] font-bold tracking-[0.06em] text-white uppercase flex items-center gap-2">
                      CONTACT ME
                      <span className="w-1.5 h-1.5 rounded-full bg-pink-400 group-hover:animate-ping" />
                    </span>
                  </div>
                </a>
              </div>

            </div>

          </div>

          {/* Bottom indicator */}
          <div className="relative z-10 w-full py-4 flex justify-center text-white/40 text-[10px] uppercase tracking-widest font-mono">
            <span>SCROLL TO EXPLORE ↓</span>
          </div>
        </section>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<HeroSection />);
  </script>
</body>
</html>
